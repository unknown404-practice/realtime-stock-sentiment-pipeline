services:
  # ==========================================
  # Apache Kafka in KRaft Mode (No ZooKeeper)
  # ==========================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: stock-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft cluster configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node cluster settings & horizontal scaling partitions
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "4L622nShTUiAnsYh0-X41w"
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - stock-network

  # ==========================================
  # Kafka Topic Initializer
  # ==========================================
  init-kafka:
    image: apache/kafka:3.7.0
    container_name: stock-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Waiting for Kafka broker to be ready...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      echo 'Creating Kafka topic: stock-news with 4 partitions'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic stock-news --replication-factor 1 --partitions 4
      echo 'Topic stock-news verified/created with 4 partitions.'
      "
    networks:
      - stock-network

  # ==========================================
  # Authenticated MongoDB Database
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: stock-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-securepassword123}
      MONGO_INITDB_DATABASE: StockDB
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - stock-network

  # ==========================================
  # Real-Time Stock News Producer Worker
  # ==========================================
  producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-producer
    command: ["python", "producer.py", "--bootstrap-servers", "kafka:29092", "--interval", "1.0"]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: stock-news
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    restart: unless-stopped
    networks:
      - stock-network

  # ==========================================
  # Batched FinBERT Sentiment Consumer Worker
  # ==========================================
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-consumer
    command: ["python", "consumer.py", "--bootstrap-servers", "kafka:29092", "--mongo-uri", "mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-securepassword123}@mongodb:27017/StockDB?authSource=admin"]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: stock-news
      LOCAL_MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-securepassword123}@mongodb:27017/StockDB?authSource=admin
      DB_NAME: StockDB
    restart: unless-stopped
    networks:
      - stock-network

  # ==========================================
  # Streamlit Presentation Dashboard
  # ==========================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-dashboard
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      LOCAL_MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-securepassword123}@mongodb:27017/StockDB?authSource=admin
      DB_NAME: StockDB
    restart: unless-stopped
    networks:
      - stock-network

volumes:
  kafka_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  stock-network:
    driver: bridge
